<div style="margin-bottom: 14px;">
    <h2 style="margin: 0 0 4px; color: var(--primary); font-size: 18px;">🔧 Tra Cứu & Xử Lý Lỗi Biến Tần</h2>
    <p style="margin: 0; font-size: 13px; color: #64748b;">Tìm nhanh theo mã lỗi hoặc lọc theo dòng biến tần PowerS, Voltique, SAJ.</p>
</div>
<div class="filter-bar">
    <input type="text" id="errSearchInput" placeholder="🔍 Nhập mã lỗi (VD: E.OC1, Err02, E04)..." oninput="renderErrorsPage(1)">
    <select id="errBrandSelect" onchange="renderErrorsPage(1)">
        <option value="ALL">Tất cả dòng biến tần</option>
        <option value="PowerS">Biến tần PowerS</option>
        <option value="Voltique">Biến tần Voltique</option>
        <option value="SAJ">Biến tần SAJ</option>
    </select>
</div>
<div class="table-wrap">
    <table class="data-table">
        <thead>
            <tr>
                <th>Dòng biến tần</th>
                <th>Mã lỗi</th>
                <th>Mô tả lỗi</th>
                <th>Cách xử lý</th>
            </tr>
        </thead>
        <tbody id="errorTableBody"></tbody>
    </table>
</div>
<div class="pagination" id="errorPagination"></div>
